<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knee Strengthening Routine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .carousel-inner {
            transition: transform 0.5s ease-in-out;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }

            .video-container iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: 0;
            }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col items-center py-10">

    <div class="max-w-3xl w-full px-4">
        <h1 class="text-3xl font-bold text-center text-blue-700 mb-8">Non-Weight-Bearing Knee Exercises</h1>

        <div class="relative bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
            <div id="carousel" class="flex carousel-inner w-full"></div>

            <div class="flex justify-between items-center p-4 bg-gray-50 border-t border-gray-200">
                <button id="prevBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    &larr; Previous
                </button>
                <span id="slideIndicator" class="text-gray-600 font-medium">1 / 1</span>
                <button id="nextBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
                    Next &rarr;
                </button>
            </div>
        </div>
    </div>

    <script>
        /*
            Edit only this section to add/remove exercise slides.
            Each object becomes one exercise slide with its own counter.
        */
        const exerciseSlides = [
            {
                title: 'Straight Leg Raises',
                sets: 3,
                reps: '10-15 per leg',
                restSeconds: 60,
                videoTitle: 'Straight Leg Raise',
                videoSrc: 'https://cdnapisec.kaltura.com/p/520801/embedPlaykitJs/uiconf_id/54758562?iframeembed=true&entry_id=1_tqnx0qc0&config%5Bprovider%5D=%7B%22widgetId%22%3A%221_uyn7d59e%22%7D&config%5Bplayback%5D=%7B%22startTime%22%3A0%7D'
            },
            {
                title: 'Short-Arc Quads',
                sets: 3,
                reps: '10-15 per leg',
                restSeconds: 60,
                videoTitle: 'Short Arc Quad',
                videoSrc: 'https://cdnapisec.kaltura.com/p/520801/embedPlaykitJs/uiconf_id/54758562?iframeembed=true&entry_id=1_bbacyfq0&config%5Bprovider%5D=%7B%22widgetId%22%3A%221_6sp0cm89%22%7D&config%5Bplayback%5D=%7B%22startTime%22%3A0%7D'
            },
            {
                title: 'Side-Lying Leg Raises',
                sets: 3,
                reps: '10-15 per leg',
                restSeconds: 90,
                videoTitle: 'Straight Leg Raise in Side Lying',
                videoSrc: 'https://cdnapisec.kaltura.com/p/520801/embedPlaykitJs/uiconf_id/54758562?iframeembed=true&entry_id=1_04bheu4l&config%5Bprovider%5D=%7B%22widgetId%22%3A%221_17zq2gtb%22%7D&config%5Bplayback%5D=%7B%22startTime%22%3A0%7D'
            },
            {
                title: 'Clamshells',
                sets: 3,
                reps: '10-15 per leg',
                restSeconds: 60,
                videoTitle: 'Clamshells',
                videoSrc: 'https://cdnapisec.kaltura.com/p/520801/embedPlaykitJs/uiconf_id/54758562?iframeembed=true&entry_id=1_ysqqzvqh&config%5Bprovider%5D=%7B%22widgetId%22%3A%221_e2yvrwin%22%7D&config%5Bplayback%5D=%7B%22startTime%22%3A0%7D'
            },
            {
                title: 'Prone Knee Flexion',
                sets: 3,
                reps: '10-15 per leg',
                restSeconds: 120,
                videoTitle: 'Prone Knee Flexion',
                videoSrc: 'https://cdnapisec.kaltura.com/p/520801/embedPlaykitJs/uiconf_id/54758562?iframeembed=true&entry_id=1_73go2v0l&config%5Bprovider%5D=%7B%22widgetId%22%3A%221_to26m6nb%22%7D&config%5Bplayback%5D=%7B%22startTime%22%3A0%7D'
            },
            {
                title: 'Seated Knee Extensions',
                sets: 3,
                reps: '10-15 per leg',
                restSeconds: 60,
                videoTitle: 'Seated Knee Extension - quadriceps activation exercise',
                videoSrc: 'https://www.youtube.com/embed/H0ejJlqpmK0'
            }
        ];

        const completionSlide = {
            title: 'Great Job!',
            message: 'You completed the routine. Use the button below to reset all counters and start again.'
        };

        const storageKey = 'knee-exercise-set-counts';
        const carousel = document.getElementById('carousel');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideIndicator = document.getElementById('slideIndicator');

        let currentSlide = 0;
        let setCounts = loadSetCounts();
        const restStates = exerciseSlides.map(slide => ({
            defaultSeconds: slide.restSeconds ?? 30,
            remainingSeconds: slide.restSeconds ?? 30,
            intervalId: null,
            active: false
        }));
        const totalSlides = exerciseSlides.length + 1;

        function loadSetCounts() {
            const saved = localStorage.getItem(storageKey);

            if (!saved) {
                return Array(exerciseSlides.length).fill(0);
            }

            try {
                const parsed = JSON.parse(saved);
                const normalized = Array(exerciseSlides.length).fill(0);

                if (Array.isArray(parsed)) {
                    for (let i = 0; i < Math.min(parsed.length, exerciseSlides.length); i++) {
                        normalized[i] = Number.isFinite(Number(parsed[i])) ? Number(parsed[i]) : 0;
                    }
                }

                return normalized;
            } catch {
                return Array(exerciseSlides.length).fill(0);
            }
        }

        function saveSetCounts() {
            localStorage.setItem(storageKey, JSON.stringify(setCounts));
        }

        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function createExerciseSlide(slide, index) {
            return `
        <div class="w-full flex-shrink-0 p-6">
            <div class="flex items-center justify-between gap-4 mb-2">
                <h2 class="text-2xl font-semibold">${slide.title}</h2>
            </div>

            <p class="text-gray-600 mb-4">Sets: ${slide.sets} | Reps: ${slide.reps}</p>

            <div class="flex items-center justify-between gap-4 mb-4 p-4 bg-blue-50 border border-blue-100 rounded-lg">
                <div>
                    <p data-set-label="${index}" class="text-sm text-gray-500">Sets performed</p>
                    <p data-set-count-text="${index}" class="text-2xl font-bold text-blue-700">
                        <span data-set-count="${index}">0</span> / ${slide.sets}
                    </p>
                </div>

                <div class="flex items-center gap-2">
                    <div data-set-actions="${index}" class="flex items-center gap-2">
                        <button type="button" data-set-decrement="${index}" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">−</button>
                        <button type="button" data-set-increment="${index}" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">+ Add Set</button>
                    </div>

                    <button
                        type="button"
                        data-rest-toggle="${index}"
                        class="hidden px-4 py-2 bg-orange-600 text-white rounded hover:bg-orange-700 whitespace-nowrap"
                    >
                        Resting ${formatTime(slide.restSeconds ?? 30)}
                    </button>
                </div>
            </div>

            <div class="video-container bg-gray-200 rounded-lg">
                <iframe
                    src="${slide.videoSrc}"
                    title="${slide.videoTitle}"
                    allowfullscreen
                    webkitallowfullscreen
                    mozAllowFullScreen
                    allow="autoplay *; fullscreen *; encrypted-media *"
                    sandbox="allow-downloads allow-forms allow-same-origin allow-scripts allow-top-navigation allow-pointer-lock allow-popups allow-modals allow-orientation-lock allow-pops-to-escape-sandbox allow-presentation allow-top-navigation-by-user-activation">
                </iframe>
            </div>
        </div>
    `;
        }

        function createCompletionSlide() {
            return `
                    <div class="w-full flex-shrink-0 p-6 flex flex-col items-center justify-center text-center">
                        <h2 class="text-3xl font-bold text-green-700 mb-4">${completionSlide.title}</h2>
                        <p class="text-gray-600 mb-8">${completionSlide.message}</p>

                        <button type="button" data-action="reset-all" class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 font-semibold">
                            Reset All Counters
                        </button>
                    </div>
                `;
        }

        function renderSlides() {
            carousel.innerHTML = exerciseSlides.map(createExerciseSlide).join('') + createCompletionSlide();
        }

        function updateSetAppearance(slideIndex) {
            const slide = exerciseSlides[slideIndex];
            const completed = setCounts[slideIndex] >= slide.sets;

            const labelElements = document.querySelectorAll(`[data-set-label="${slideIndex}"]`);
            const countTextElements = document.querySelectorAll(`[data-set-count-text="${slideIndex}"]`);
            const addButtons = document.querySelectorAll(`[data-set-increment="${slideIndex}"]`);

            labelElements.forEach(element => {
                element.textContent = completed ? 'Sets completed' : 'Sets performed';
                element.classList.toggle('text-green-700', completed);
                element.classList.toggle('text-gray-500', !completed);
            });

            countTextElements.forEach(element => {
                element.classList.toggle('text-green-700', completed);
                element.classList.toggle('text-blue-700', !completed);
            });

            addButtons.forEach(button => {
                button.classList.toggle('bg-green-600', completed);
                button.classList.toggle('hover:bg-green-700', completed);
                button.classList.toggle('bg-blue-600', !completed);
                button.classList.toggle('hover:bg-blue-700', !completed);
            });
        }

        function updateSetCount(slideIndex, shouldSave = true) {
            const countElements = document.querySelectorAll(`[data-set-count="${slideIndex}"]`);
            countElements.forEach(element => {
                element.textContent = setCounts[slideIndex];
            });

            const decrementButtons = document.querySelectorAll(`[data-set-decrement="${slideIndex}"]`);
            decrementButtons.forEach(button => {
                button.disabled = setCounts[slideIndex] === 0;
            });

            updateSetAppearance(slideIndex);

            if (shouldSave) {
                saveSetCounts();
            }
        }

        function updateAllSetCounts() {
            exerciseSlides.forEach((_, index) => updateSetCount(index, false));
            saveSetCounts();
        }

        function updateRestControl(slideIndex) {
            const state = restStates[slideIndex];
            const restButton = document.querySelector(`[data-rest-toggle="${slideIndex}"]`);
            const setActions = document.querySelector(`[data-set-actions="${slideIndex}"]`);

            if (!restButton || !setActions) {
                return;
            }

            setActions.classList.toggle('hidden', state.active);
            restButton.classList.toggle('hidden', !state.active);

            if (state.active) {
                restButton.textContent = `Resting ${formatTime(state.remainingSeconds)}`;
                restButton.classList.remove('bg-orange-500', 'hover:bg-orange-600');
                restButton.classList.add('bg-green-600', 'hover:bg-green-700');
            } else {
                restButton.textContent = `Resting ${formatTime(state.defaultSeconds)}`;
                restButton.classList.remove('bg-green-600', 'hover:bg-green-700');
                restButton.classList.add('bg-orange-500', 'hover:bg-orange-600');
            }
        }

        function clearRestTimer(slideIndex) {
            const state = restStates[slideIndex];
            if (state.intervalId !== null) {
                clearInterval(state.intervalId);
                state.intervalId = null;
            }
        }

        function stopRestTimer(slideIndex) {
            const state = restStates[slideIndex];
            clearRestTimer(slideIndex);
            state.active = false;
            state.remainingSeconds = state.defaultSeconds;
            updateRestControl(slideIndex);
        }

        function startRestTimer(slideIndex) {
            const state = restStates[slideIndex];

            clearRestTimer(slideIndex);

            state.remainingSeconds = Math.max(1, Number(state.defaultSeconds) || 30);
            state.active = true;
            updateRestControl(slideIndex);

            state.intervalId = setInterval(() => {
                state.remainingSeconds -= 1;

                if (state.remainingSeconds <= 0) {
                    stopRestTimer(slideIndex);
                    return;
                }

                updateRestControl(slideIndex);
            }, 1000);
        }

        function resetAllRestTimers() {
            restStates.forEach((state, index) => {
                clearRestTimer(index);
                state.active = false;
                state.defaultSeconds = exerciseSlides[index].restSeconds ?? 30;
                state.remainingSeconds = state.defaultSeconds;
                updateRestControl(index);
            });
        }

        function updateCarousel() {
            carousel.style.transform = `translateX(-${currentSlide * 100}%)`;
            slideIndicator.textContent = `${currentSlide + 1} / ${totalSlides}`;
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === totalSlides - 1;
        }

        function resetAllCounters() {
            setCounts = Array(exerciseSlides.length).fill(0);
            updateAllSetCounts();
            resetAllRestTimers();
            currentSlide = 0;
            updateCarousel();
        }

        carousel.addEventListener('click', (event) => {
            const incrementButton = event.target.closest('[data-set-increment]');
            if (incrementButton) {
                const slideIndex = Number(incrementButton.getAttribute('data-set-increment'));
                setCounts[slideIndex]++;
                updateSetCount(slideIndex);
                startRestTimer(slideIndex);
                return;
            }

            const decrementButton = event.target.closest('[data-set-decrement]');
            if (decrementButton) {
                const slideIndex = Number(decrementButton.getAttribute('data-set-decrement'));
                if (setCounts[slideIndex] > 0) {
                    setCounts[slideIndex]--;
                    updateSetCount(slideIndex);
                }
                return;
            }

            const restButton = event.target.closest('[data-rest-toggle]');
            if (restButton) {
                const slideIndex = Number(restButton.getAttribute('data-rest-toggle'));
                stopRestTimer(slideIndex);
                return;
            }

            const resetButton = event.target.closest('[data-action="reset-all"]');
            if (resetButton) {
                resetAllCounters();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentSlide > 0) {
                currentSlide--;
                updateCarousel();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateCarousel();
            }
        });

        renderSlides();
        updateAllSetCounts();
        resetAllRestTimers();
        updateCarousel();
    </script>
</body>
</html>
